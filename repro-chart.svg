<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" style="background:#0d1117;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <text x="460" y="38" fill="#f0f6fc" font-size="18" font-weight="700" text-anchor="middle">@earendil-works/pi-durable@1.4.0 — Disjoint Conversation Commit Latency vs Concurrency (N = 1..32)</text>
  <text x="460" y="62" fill="#8b949e" font-size="13" text-anchor="middle">4ms simulated network DB RTT per Storage call (32-connection pool), 0.0ms CPU work in transaction callbacks</text>

  <!-- Axes & Grid -->
  <g stroke="#21262d" stroke-width="1">
    <line x1="90" y1="400" x2="860" y2="400"/>
    <line x1="90" y1="325" x2="860" y2="325"/>
    <line x1="90" y1="250" x2="860" y2="250"/>
    <line x1="90" y1="175" x2="860" y2="175"/>
    <line x1="90" y1="100" x2="860" y2="100"/>
  </g>
  <g fill="#8b949e" font-size="12" text-anchor="end">
    <text x="80" y="404">0 ms</text>
    <text x="80" y="329">80 ms</text>
    <text x="80" y="254">160 ms</text>
    <text x="80" y="179">240 ms</text>
    <text x="80" y="104">320 ms</text>
  </g>

  <!-- X-axis labels: N = 1, 2, 4, 8, 16, 32 at x = 140, 270, 400, 530, 660, 790 -->
  <g fill="#c9d1d9" font-size="13" font-weight="600" text-anchor="middle">
    <text x="140" y="428">N = 1</text>
    <text x="270" y="428">N = 2</text>
    <text x="400" y="428">N = 4</text>
    <text x="530" y="428">N = 8</text>
    <text x="660" y="428">N = 16</text>
    <text x="790" y="428">N = 32</text>
  </g>

  <!-- Curve 1: Ideal Per-Scope DB Pool p95 (4.6, 4.7, 4.5, 4.7, 4.6, 4.9 ms) -->
  <polyline fill="none" stroke="#3fb950" stroke-width="3" stroke-dasharray="6,4"
    points="140,395.7 270,395.6 400,395.8 530,395.6 660,395.7 790,395.4"/>
  <g fill="#3fb950" font-size="11" font-weight="600" text-anchor="middle">
    <circle cx="140" cy="395.7" r="4"/><text x="140" y="386">4.6ms</text>
    <circle cx="270" cy="395.6" r="4"/><text x="270" y="386">4.7ms</text>
    <circle cx="400" cy="395.8" r="4"/><text x="400" y="386">4.5ms</text>
    <circle cx="530" cy="395.6" r="4"/><text x="530" y="386">4.7ms</text>
    <circle cx="660" cy="395.7" r="4"/><text x="660" y="386">4.6ms</text>
    <circle cx="790" cy="395.4" r="4"/><text x="790" y="386">4.9ms</text>
  </g>

  <!-- Curve 2: pi-durable Disjoint ConversationDoc p50 (5.2, 5.1, 9.6, 19.2, 37.6, 76.3 ms) -->
  <polyline fill="none" stroke="#58a6ff" stroke-width="3"
    points="140,395.1 270,395.2 400,391.0 530,382.0 660,364.8 790,328.5"/>
  <g fill="#58a6ff" font-size="11" font-weight="600" text-anchor="middle">
    <circle cx="140" cy="395.1" r="4"/>
    <circle cx="270" cy="395.2" r="4"/>
    <circle cx="400" cy="391.0" r="4"/><text x="400" y="378">9.6ms</text>
    <circle cx="530" cy="382.0" r="4"/><text x="530" y="370">19.2ms</text>
    <circle cx="660" cy="364.8" r="4"/><text x="660" y="352">37.6ms</text>
    <circle cx="790" cy="328.5" r="4"/><text x="790" y="316">76.3ms</text>
  </g>

  <!-- Curve 3: pi-durable Disjoint ConversationDoc p95 (5.2, 5.1, 23.6, 61.1, 136.2, 272.1 ms) -->
  <polyline fill="none" stroke="#d29922" stroke-width="3.5"
    points="140,395.1 270,395.2 400,377.9 530,342.7 660,272.3 790,144.9"/>
  <g fill="#d29922" font-size="11" font-weight="700" text-anchor="middle">
    <circle cx="140" cy="395.1" r="4.5"/><text x="140" y="368">5.2ms</text>
    <circle cx="270" cy="395.2" r="4.5"/><text x="270" y="368">5.1ms</text>
    <circle cx="400" cy="377.9" r="4.5"/><text x="400" y="362">23.6ms</text>
    <circle cx="530" cy="342.7" r="4.5"/><text x="530" y="328">61.1ms</text>
    <circle cx="660" cy="272.3" r="4.5"/><text x="660" y="258">136.2ms</text>
    <circle cx="790" cy="144.9" r="4.5"/><text x="790" y="132">272.1ms</text>
  </g>

  <!-- Curve 4: pi-durable Disjoint appendEntry + doc + 2 Cold Snapshots p95 (28.5, 28.0, 45.9, 87.9, 158.4, 303.4 ms) -->
  <polyline fill="none" stroke="#f85149" stroke-width="3.5"
    points="140,373.3 270,373.8 400,357.0 530,317.6 660,251.5 790,115.6"/>
  <g fill="#f85149" font-size="11" font-weight="700" text-anchor="middle">
    <circle cx="140" cy="373.3" r="4.5"/><text x="140" y="352">28.5ms</text>
    <circle cx="270" cy="373.8" r="4.5"/><text x="270" y="352">28.0ms</text>
    <circle cx="400" cy="357.0" r="4.5"/><text x="400" y="340">45.9ms</text>
    <circle cx="530" cy="317.6" r="4.5"/><text x="530" y="302">87.9ms</text>
    <circle cx="660" cy="251.5" r="4.5"/><text x="660" y="236">158.4ms</text>
    <circle cx="790" cy="115.6" r="4.5"/><text x="790" y="100">303.4ms</text>
  </g>

  <!-- Legend -->
  <g transform="translate(105, 455)" font-size="12" fill="#c9d1d9">
    <line x1="0" y1="-4" x2="22" y2="-4" stroke="#3fb950" stroke-width="3" stroke-dasharray="5,3"/>
    <text x="28" y="0">Ideal Per-Conv Pool (p95)</text>

    <line x1="205" y1="-4" x2="227" y2="-4" stroke="#58a6ff" stroke-width="3"/>
    <text x="233" y="0">Disjoint Doc Commit (p50)</text>

    <line x1="415" y1="-4" x2="437" y2="-4" stroke="#d29922" stroke-width="3.5"/>
    <text x="443" y="0">Disjoint Doc Commit (p95)</text>

    <line x1="625" y1="-4" x2="647" y2="-4" stroke="#f85149" stroke-width="3.5"/>
    <text x="653" y="0">appendEntry + Cold Snapshot (p95)</text>
  </g>
</svg>